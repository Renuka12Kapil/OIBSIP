<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature Converter | Oasis Infobyte</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .converter-container {
            max-width: 900px;
            margin: 60px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .left-panel {
            background-color:#5c00cc;
            color: #fff;
            padding: 40px;
            text-align: center;
        }

        .left-panel h2 {
            font-weight: 700;
        }

        .right-panel {
            background-color:#fc0394;
            color: #ffffff;
            padding: 40px;
        }

        label {
            font-weight: 500;
        }

        .form-control, .form-select {
            border-radius: 6px;
        }

        .btn-convert {
            background-color: #00c27a;
            color: #fff;
            border: none;
            font-weight: 600;
        }

        .btn-convert:hover {
            background-color: #00a866;
        }

        .result-box {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #00ffb3;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container converter-container">
    <div class="row g-0">
        
        <!-- LEFT SECTION -->
        <div class="col-md-4 left-panel d-flex flex-column justify-content-center">
            <h2>LEVEL 1</h2>
            <h5 class="mt-2">TASK 3</h5>
            <p class="mt-4">
                Temperature Converter Website
            </p>
        </div>

        <!-- RIGHT SECTION -->
        <div class="col-md-8 right-panel">
            <h4 class="mb-4">Temperature Converter</h4>

            <form id="tempForm">
                <!-- Temperature Input -->
                <div class="mb-3">
                    <label>Enter Temperature</label>
                    <input type="number" id="temperature" class="form-control" placeholder="Enter value" required>
                </div>

                <!-- Unit Selection -->
                <div class="mb-3">
                    <label>Select Unit</label>
                    <select id="unit" class="form-select">
                        <option value="celsius">Celsius</option>
                        <option value="fahrenheit">Fahrenheit</option>
                    </select>
                </div>

                <!-- Convert Button -->
                <button type="button" class="btn btn-convert w-100" onclick="convertTemp()">
                    Convert
                </button>
            </form>

            <!-- Result -->
            <div id="result" class="result-box"></div>

        </div>
    </div>
</div>

<footer>
    © AICTE Oasis Infobyte Internship | Level 1 Task 3
</footer>

<!-- JavaScript -->
<script>
    function convertTemp() {
        let temp = document.getElementById("temperature").value;
        let unit = document.getElementById("unit").value;
        let result = document.getElementById("result");

        if (temp === "") {
            result.innerHTML = "⚠️ Please enter a temperature value.";
            return;
        }

        temp = parseFloat(temp);
        let converted;

        if (unit === "celsius") {
            converted = (temp * 9/5) + 32;
            result.innerHTML = `${temp} °C = ${converted.toFixed(2)} °F`;
        } else {
            converted = (temp - 32) * 5/9;
            result.innerHTML = `${temp} °F = ${converted.toFixed(2)} °C`;
        }
    }
</script>

</body>
</html>
